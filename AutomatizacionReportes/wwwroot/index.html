<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatización de Reportes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95em;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-height: 120px;
            justify-content: center;
            text-align: center;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-whatsapp:active {
            transform: translateY(0);
        }

        .btn-email {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-email:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .btn-email:active {
            transform: translateY(0);
        }

        .btn-sms {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-sms:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
        }

        .btn-sms:active {
            transform: translateY(0);
        }

        .btn-reports {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .btn-reports:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(67, 233, 123, 0.4);
        }

        .btn-reports:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .icon {
            font-size: 32px;
        }

        .label {
            font-size: 14px;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Automatización de Reportes</h1>
        <p class="subtitle">Herramienta para generación de reportes automatizados</p>

        <div class="buttons-grid">
            <button class="btn btn-whatsapp" onclick="ejecutarAccion('whatsapp')">
                <span class="icon">💬</span>
                <span class="label">WhatsApp</span>
            </button>
            <button class="btn btn-email" disabled>
                <span class="icon">🔒</span>
                <span class="label">Próximamente</span>
            </button>
            <button class="btn btn-sms" disabled>
                <span class="icon">🔒</span>
                <span class="label">Próximamente</span>
            </button>
            <button class="btn btn-reports" disabled>
                <span class="icon">🔒</span>
                <span class="label">Próximamente</span>
            </button>
        </div>

        <div id="status" class="status"></div>

        <div class="footer">
            <p>Sistema de Automatización v1.0</p>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');

        async function ejecutarAccion(tipo) {
            if (tipo !== 'whatsapp') {
                mostrarEstado('Este endpoint aún no está definido', 'error');
                return;
            }

            try {
                mostrarEstado('<span class="spinner"></span> Ejecutando WhatsApp...', 'loading');

                const response = await fetch('/api/procesos/whatsapp/ejecutar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    mostrarEstado('✅ WhatsApp ejecutado exitosamente', 'success');
                } else if (response.status === 409) {
                    const data = await response.json();
                    mostrarEstado(`⚠️ ${data.message || 'Proceso ya en ejecución'}`, 'error');
                } else {
                    const data = await response.json();
                    mostrarEstado(`❌ Error: ${data.message || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                mostrarEstado(`❌ Error de conexión: ${error.message}`, 'error');
            }
        }

        function mostrarEstado(mensaje, tipo) {
            statusDiv.textContent = mensaje;
            statusDiv.className = `status show ${tipo}`;

            if (tipo !== 'loading') {
                setTimeout(() => {
                    statusDiv.classList.remove('show');
                }, 5000);
            }
        }
    </script>
</body>
</html>
